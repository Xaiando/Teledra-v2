name: Windows CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TELEDRA_BUILD_ID: ${{ github.sha }}

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
        cache-dependency-path: |
          requirements-core.txt
          requirements-all.txt
          requirements-tts.txt
          requirements-somatic.txt
          requirements-copilot.txt

    - name: Install Python dependencies
      run: |
        python -m venv .venv
        .\.venv\Scripts\Activate.ps1
        python -m pip install --upgrade pip
        pip install -r requirements-all.txt

    - name: Compile and Test Python sidecars
      run: |
        .\.venv\Scripts\Activate.ps1
        python -m compileall -q -x "\.venv|tools[\\/]experiments|kraken[\\/]workspace" .
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python -m unittest discover tests

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: strudel_app/package-lock.json

    - name: Install Strudel dependencies
      run: npm ci --prefix strudel_app

    - name: Build
      run: cargo build --release --locked

    - name: Run tests
      run: cargo test --all-targets --locked

    - name: Verify Environment Check
      run: cargo run --release --locked -- --minimal --check-environment
