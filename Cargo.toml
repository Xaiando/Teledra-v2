[workspace]
members = [
    "Agents",
    "Court",
    "Fractus",
    "Memory",
    "Music",
    "Research",
    "Sidecars",
    "Swarm",
    "Frankenswarm",
    "Kraken",
    "Tower",
    "Workshop",
    "Teledra",
    "Teledra/Brain",
    "TTS",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "time"] }
